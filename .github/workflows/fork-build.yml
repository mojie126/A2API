name: performance-build

# 个人 fork 的 Windows 资产与 GHCR 容器镜像构建
#
# 只保留 Windows 桌面端、Windows 服务端和 linux/amd64 容器镜像
# 工作流只允许在 Actions 页面手动触发，不响应标签推送

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows 桌面端
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop-tauri/package-lock.json

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@1.88

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri -> ../../target

      - name: 安装桌面端依赖
        run: npm --prefix desktop-tauri ci

      - name: 构建 Windows 安装包
        run: npm --prefix desktop-tauri run build

      - name: 上传 Windows 安装包
        uses: actions/upload-artifact@v7
        with:
          name: windows-nsis
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  windows-server:
    name: Windows 服务端
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@1.88

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri -> ../../target

      - name: 构建服务端
        working-directory: desktop-tauri/src-tauri
        run: cargo build --release -p agent2api-server --bin agent2api-server

      - name: 打包服务端
        shell: pwsh
        run: |
          $name = "agent2api-server-windows-amd64"
          $stage = "stage/$name"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          Copy-Item "target/release/agent2api-server.exe" "$stage/"
          Copy-Item -Recurse "desktop-tauri/ui" "$stage/ui"
          Copy-Item "packaging/windows/install-service.ps1" "$stage/"

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/$name.zip" -Force

          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "dist/$name.zip.sha256"

          Get-ChildItem dist | Format-Table Name, Length

      - name: 上传 Windows 服务端包
        uses: actions/upload-artifact@v7
        with:
          name: windows-server-amd64
          path: dist/*
          if-no-files-found: error

  docker:
    name: GHCR linux/amd64 镜像
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/a2api
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            type=raw,value=latest

      - name: 构建并推送镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
