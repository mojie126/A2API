name: performance-build

# 个人 fork 的 Windows 资产、GHCR 容器镜像与草稿 Release 构建
#
# 只保留 Windows 桌面端、Windows 服务端和 linux/amd64 容器镜像
# 工作流只允许在 Actions 页面手动触发，不响应标签推送
# Release 固定按应用版本创建为草稿，由人工确认后再正式发布

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: 构建前校验
    runs-on: ubuntu-latest
    outputs:
      title: ${{ steps.title.outputs.value }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            desktop-tauri/ui-kit/package-lock.json
            desktop-tauri/ui-islands/package-lock.json
            desktop-tauri/mobile/package-lock.json
            desktop-tauri/i18n/package-lock.json

      - name: 安装前端依赖
        run: |
          npm --prefix desktop-tauri/ui-kit ci
          npm --prefix desktop-tauri/ui-islands ci
          npm --prefix desktop-tauri/mobile ci
          npm --prefix desktop-tauri/i18n ci

      - name: 重建前端产物
        run: |
          npm --prefix desktop-tauri/ui-islands run build
          npm --prefix desktop-tauri/mobile run build
          npm --prefix desktop-tauri/i18n run build

      # 判据与上游 frontend-artifacts.yml 相同：入库产物必须能被源码逐字节
      # 复现，拦住「改了源码没重建」与「手改产物」两种形态 —— 界面源码改
      # 动后只提交源码、不带重建产物，会把旧样式打进全部平台的安装包
      - name: 校验前端产物同源
        run: |
          changed="$(git status --porcelain -- desktop-tauri/ui)"
          if [ -z "$changed" ]; then
            echo "入库的前端构建产物可由源码复现（逐字节相同）"
            exit 0
          fi
          echo "::error::入库的前端产物与源码不同源（改了源码没重建，或手改了产物）"
          echo
          echo "--- 差异文件（M=被改动 / ??=构建新产出未入库 / D=已入库但不再产出）---"
          echo "$changed"
          echo
          echo "--- 内容差异摘要 ---"
          git --no-pager diff --stat -- desktop-tauri/ui
          echo
          echo "本地修复方式："
          echo "  powershell scripts/build-desktop.ps1 -FrontendOnly"
          echo "  npm --prefix desktop-tauri/ui-islands run build"
          echo "  npm --prefix desktop-tauri/mobile run build"
          echo "  npm --prefix desktop-tauri/i18n run build"
          echo "（不要手动编辑 ui/islands/ui.js、ui/islands/ui.css、ui/m/** —— 它们是产物，重建即可）"
          exit 1

      - name: 校验应用版本
        id: release
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' desktop-tauri/src-tauri/server/Cargo.toml | head -1)"
          desktop_version="$(jq -r .version desktop-tauri/package.json)"
          app_version="$(jq -r .version package.json)"
          tauri_version="$(jq -r .version desktop-tauri/src-tauri/tauri.conf.json)"
          desktop_rust_version="$(sed -n 's/^version = "\(.*\)"/\1/p' desktop-tauri/src-tauri/Cargo.toml | head -1)"
          mobile_version="$(jq -r .version desktop-tauri/mobile/package.json)"
          if [[ -z "$version" || "$desktop_version" != "$version" || "$app_version" != "$version" || "$tauri_version" != "$version" || "$desktop_rust_version" != "$version" || "$mobile_version" != "$version" ]]; then
            echo "::error::应用版本号不一致，服务端=$version 桌面端=$desktop_version 根目录=$app_version Tauri=$tauri_version 桌面端Rust=$desktop_rust_version 手机端=$mobile_version"
            exit 1
          fi
          provider_protocol_tag="$(sed -n '/agent2api-provider-protocol =/s/.*tag = "v\([^"]*\)".*/\1/p' desktop-tauri/src-tauri/server/Cargo.toml | head -1)"
          if [[ "$provider_protocol_tag" != "$version" ]]; then
            echo "::error::提供商协议库版本与网关不一致，网关=$version 协议库=$provider_protocol_tag"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: 读取已发布版本
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${{ steps.release.outputs.version }}"
          echo "current=$(gh release view "$tag" --json isDraft --jq '.isDraft == false' 2>/dev/null || echo false)" >> "$GITHUB_OUTPUT"

      - name: 计算发布标题
        id: title
        env:
          CURRENT_PUBLISHED: ${{ steps.published.outputs.current }}
          RUN_NUMBER: ${{ github.run_number }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          title="v$VERSION"
          if [[ "$CURRENT_PUBLISHED" == "true" ]]; then
            title="${title}-r${RUN_NUMBER}"
          fi
          echo "value=$title" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows 桌面端
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop-tauri/package-lock.json

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri -> ../../target

      - name: 安装桌面端依赖
        run: npm --prefix desktop-tauri ci

      - name: 构建 Windows 安装包
        run: npm --prefix desktop-tauri run build

      - name: 上传 Windows 安装包
        uses: actions/upload-artifact@v7
        with:
          name: windows-nsis
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  windows-server:
    name: Windows 服务端
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri -> ../../target

      - name: 构建服务端
        working-directory: desktop-tauri/src-tauri
        run: cargo build --release -p agent2api-server --bin agent2api-server

      - name: 打包服务端
        shell: pwsh
        run: |
          $name = "agent2api-server-windows-amd64"
          $stage = "stage/$name"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          Copy-Item "target/release/agent2api-server.exe" "$stage/"
          Copy-Item -Recurse "desktop-tauri/ui" "$stage/ui"
          Copy-Item "packaging/windows/install-service.ps1" "$stage/"

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/$name.zip" -Force

          Get-ChildItem dist | Format-Table Name, Length

      - name: 上传 Windows 服务端包
        uses: actions/upload-artifact@v7
        with:
          name: windows-server-amd64
          path: dist/*
          if-no-files-found: error

  docker:
    name: GHCR linux/amd64 镜像
    runs-on: ubuntu-latest
    needs:
      - prepare
    permissions:
      contents: read
      packages: write
      actions: write
    steps:
      - uses: actions/checkout@v7

      - name: 清理旧 Docker BuildKit 分片缓存
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ids="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" \
            --jq '.actions_caches[] | select((.key | startswith("buildkit-blob-")) or (.key | startswith("index-buildkit-"))) | .id')"
          count=0
          while IFS= read -r id; do
            if [[ -n "$id" ]]; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/caches/$id" >/dev/null
              count=$((count + 1))
            fi
          done <<< "$ids"
          echo "已清理旧 Docker BuildKit 分片缓存 $count 条"

      - name: 安装 Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/a2api
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.prepare.outputs.title }}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 镜像层缓存写入 GHCR 单一标签，避免 GitHub Actions 缓存被拆成大量 blob
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/a2api:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/a2api:buildcache,mode=max

  release:
    name: 创建草稿 Release
    needs:
      - prepare
      - windows
      - windows-server
      - docker
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: 下载 Windows 桌面端资产
        uses: actions/download-artifact@v7
        with:
          name: windows-nsis
          path: dist

      - name: 下载 Windows 服务端资产
        uses: actions/download-artifact@v7
        with:
          name: windows-server-amd64
          path: dist

      - name: 校验 Release 附件
        run: |
          set -euo pipefail
          cd dist
          desktop_count="$(find . -maxdepth 1 -type f -name '*.exe' | wc -l)"
          zip_count="$(find . -maxdepth 1 -type f -name '*.zip' | wc -l)"
          if [[ "$desktop_count" -ne 1 || "$zip_count" -ne 1 ]]; then
            echo "::error::Release 附件应为桌面端与服务端包各一个"
            find . -maxdepth 1 -type f -printf '%f\n' | sort
            exit 1
          fi

      - name: 创建或更新草稿 Release
        uses: ncipollo/release-action@v1.21.0
        with:
          allowUpdates: true
          replacesArtifacts: true
          artifacts: "dist/*"
          bodyFile: docs/release-notes_3.5.0-beta.1.md
          draft: true
          tag: ${{ needs.prepare.outputs.title }}
          token: ${{ secrets.GITHUB_TOKEN }}
          updateOnlyUnreleased: true
